# Hospedagem/Deploy local de produção: docker compose up --build → http://localhost:8080
# Configure MONGODB_URI e JWT_SECRET no ambiente antes de iniciar.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:?defina MONGODB_URI para o MongoDB Atlas}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (openssl rand -hex 32)}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      ENABLE_LOCAL_LOGIN: ${ENABLE_LOCAL_LOGIN:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-40}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports: [ "8080:4000" ]
